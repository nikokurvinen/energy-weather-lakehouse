name: Daily refresh

on:
  schedule:
    # 05:17 UTC, a few minutes off the hour because runners queue heavily at :00.
    - cron: "17 5 * * *"
  workflow_dispatch:

# A second run must not overwrite the Volume while the first is still uploading.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Fetch first, upload second, trigger third. A failed fetch uploads nothing
      # and starts nothing, so the volume keeps yesterday's good files.
      - name: Fetch source data
        env:
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
          # A daily run only needs a trailing window: bronze merges on the natural
          # key, so re-fetching a full year would change nothing and cost everything.
          # Fourteen days covers Finnish balance settlement, which is when measured
          # data still gets revised. A backfill runs the same script by hand with
          # FETCH_DAYS=365.
          FETCH_DAYS: "14"
        run: python -m ingest.run_local_fetch

      - uses: databricks/setup-cli@main

      - name: Upload CSVs to the Unity Catalog volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          for file in fingrid_consumption fingrid_wind entsoe_price; do
            databricks fs cp "data/bronze_raw/${file}.csv" \
              "dbfs:/Volumes/workspace/energy_weather/landing/${file}.csv" --overwrite
          done

      - name: Trigger the Databricks job
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          # run-now waits for the run to reach a terminal state by default. On
          # failure it exits non-zero and prints an error rather than the run
          # JSON, so capture both streams and give every failure mode a name.
          # An empty result_state would still fail the check below, but it would
          # not say why, which is the difference between an alert and a riddle.
          if output=$(databricks jobs run-now 492779937214840 --timeout 30m 2>&1); then
            result=$(echo "$output" | jq -r '.state.result_state // "NO_STATE_IN_RESPONSE"')
          else
            result="CLI_ERROR"
          fi

          echo "$output"
          echo "Databricks run finished with result_state=$result"

          # Checking the state rather than the exit code also catches
          # SUCCESS_WITH_FAILURES, where individual tasks failed but the run as
          # a whole is not reported as a failure.
          if [ "$result" != "SUCCESS" ]; then
            echo "::error::Databricks job did not succeed: $result"
            exit 1
          fi