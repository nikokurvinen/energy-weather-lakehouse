name: Daily refresh

on:
  schedule:
    # 05:17 UTC, a few minutes off the hour because runners queue heavily at :00.
    - cron: "17 5 * * *"
  workflow_dispatch:

# A second run must not overwrite the Volume while the first is still uploading.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Fetch source data
        env:
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        run: python -m ingest.run_local_fetch

      - uses: databricks/setup-cli@main

      - name: Upload CSVs to the Unity Catalog volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          for file in fingrid_consumption fingrid_wind entsoe_price; do
            databricks fs cp "data/bronze_raw/${file}.csv" \
              "dbfs:/Volumes/workspace/energy_weather/landing/${file}.csv" --overwrite
          done

      - name: Trigger the Databricks job
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          # run-now waits for the run to finish by default and prints its final state.
          # The explicit check does not rely on the exit code, and it also catches
          # SUCCESS_WITH_FAILURES, where individual tasks failed but the run as a
          # whole is not reported as a failure.
          result=$(databricks jobs run-now 492779937214840 --timeout 30m \
            | tee /dev/stderr \
            | jq -r '.state.result_state')
          echo "Databricks run finished with result_state=$result"
          if [ "$result" != "SUCCESS" ]; then
            echo "::error::Databricks job did not succeed: $result"
            exit 1
          fi